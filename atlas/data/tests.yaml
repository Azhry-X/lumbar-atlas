- id: schober-rom-reliability
  title: Lumbar ROM & Postural Reference Reliability
  type: test
  page: 3
  review_status: draft
  summary: Reliability and reference values for Modified-modified Schober, Modified Schober, and Occiput-to-wall distance.
  steps:
  - 'Modified-modified Schober: Mark PSIS line (S2) and a point 15 cm superior while patient stands erect; measure distance on full flexion.'
  - 'Occiput-to-wall distance: Patient stands with heels and back against wall; measure distance from occiput to wall (normal = 0 cm).'
