- id: ces-triage
  type: info
  title: Cauda Equina Syndrome (CES) Emergency Triage & Bladder Scan Rule
  page: 1
  summary: Same-day emergency neurological triage for suspected cauda equina compression, integrating urinary retention, saddle anaesthesia, bilateral sciatica, post-void residual (PVR) bladder scanning, and surgical timing.
  steps:
  - Screen for new-onset urinary retention, difficulty initiating micturition, impaired urethral sensation, or overflow incontinence.
  - Screen for new faecal incontinence or loss of anal sphincter tone, and test perianal/perineal saddle sensation.
  - Assess for bilateral radicular leg pain, progressive lower-limb motor deficit (e.g. foot drop), or gait disturbance.
  - Perform bladder ultrasound scan to measure post-void residual (PVR) volume alongside clinical neurological assessment.
  - Activate same-day emergency pathway for urgent MRI and surgical decompression when red flags are present.
  positive: Urinary retention (Sn 0.90, Sp 0.99) or PVR > 200 mL (MRI-confirmed CES in 43%), saddle sensory deficit, bowel dysfunction, or progressive bilateral motor deficit -> same-day emergency MRI and surgical referral (decompression < 48 h associated with better outcomes).
  interpretation: Bladder status at the time of surgery is the dominant factor for bladder recovery; decompression < 48 h is associated with better outcomes.
  metrics: 'Bladder scan: PVR > 200 mL → MRI-confirmed CES in 43%; PVR < 200 mL without objective signs → MRI+ rare (Ann R Coll Surg Engl 2024). Urinary retention: Sn 0.90, Sp 0.99 (classic estimate, Deyo 1992 JAMA). Timing: decompression < 48 h associated with better outcomes (Ahn 2000 meta-analysis). Prognosis: bladder status at the time of surgery is the dominant factor for bladder recovery (Qureshi & Sell 2007).'
  evidence: L
  sources:
  - text: Ann R Coll Surg Engl 2024
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10757877/
    free_full_text: true
  - text: Qureshi & Sell 2007
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2140120/
    free_full_text: true
  - text: Ahn 2000 meta-analysis
    url: https://doi.org/10.1097/00007632-200006150-00010
    free_full_text: false
  - text: Deyo 1992 JAMA
    url: https://doi.org/10.1001/jama.1992.03490060092030
    free_full_text: false
  review_status: approved
- id: vertebral-fracture-red-flags
  type: info
  title: Vertebral Fracture Red Flags & Post-Test Probability
  page: 1
  summary: Evidence-based red-flag combination screening for thoracolumbar vertebral fracture in low back pain presentations.
  steps:
  - Assess patient age, history of prolonged systemic corticosteroid use, and mechanism of severe trauma.
  - Inspect the thoracolumbar spine and trunk for contusion or abrasion after trauma.
  - Combine multiple red flags rather than relying on any single isolated sign.
  positive: older age 9% (3–25); prolonged corticosteroid use 33% (10–67); severe trauma 11% (8–16); contusion/abrasion 62% (49–74); multiple red flags 90% (34–99).
  interpretation: most single red flags uninformative; use in combination.
  metrics: 'Downie 2013 BMJ (post-test probability): older age 9% (3–25); prolonged corticosteroid use 33% (10–67); severe trauma 11% (8–16); contusion/abrasion 62% (49–74); multiple red flags 90% (34–99). Han 2023 Cochrane: most single red flags uninformative; use in combination.'
  evidence: M
  sources:
  - text: Downie 2013 BMJ
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3898572/
    free_full_text: true
  - text: Han 2023 Cochrane
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10448864/
    free_full_text: true
  review_status: approved
- id: spinal-malignancy-red-flags
  type: info
  title: Spinal Malignancy Red Flags & Post-Test Probability
  page: 1
  summary: Triage screening for vertebral metastasis or primary spinal malignancy in primary and emergency care settings.
  steps:
  - Ask specifically about any personal history of cancer.
  - Evaluate the clinical setting (primary care vs emergency care) and screen for constitutional symptoms such as unexplained weight loss or unremitting non-mechanical pain.
  - Refer for urgent diagnostic imaging when history of cancer or combined malignancy indicators are present.
  positive: history of cancer 7% (3–16) in primary care; 33% (22–46) in emergency care.
  interpretation: History of cancer is the strongest clinical predictor of spinal malignancy; interpret post-test probability in the context of the care setting.
  metrics: 'Downie 2013 BMJ: history of cancer 7% (3–16) in primary care; 33% (22–46) in emergency care.'
  evidence: M
  sources:
  - text: Downie 2013 BMJ
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3898572/
    free_full_text: true
  review_status: approved
- id: aaa-abdominal-palpation
  type: test
  title: Abdominal Aortic Aneurysm (AAA) Palpation
  page: 1
  summary: Bimanual deep abdominal palpation screening for an expansile retroperitoneal aortic pulsation mimicking mechanical low back or flank pain.
  steps:
  - Position the patient supine with knees flexed to relax the anterior abdominal wall musculature.
  - Place both hands flat on the epigastrium/umbilical region slightly left of midline above the aortic bifurcation.
  - Palpate deeply to detect the lateral borders of the aortic pulsation and distinguish an expansile mass from a transmitted pulse.
  - Account for abdominal girth (< 100 cm vs ≥ 100 cm) when interpreting palpation sensitivity.
  positive: Palpable widened, laterally expansile pulsatile abdominal mass -> urgent vascular ultrasound; if symptomatic with tearing back/abdominal pain or hypotension -> same-day emergency department transfer.
  interpretation: Sensitivity rises with larger aneurysm diameter (≥ 5.0 cm) and waist girth < 100 cm.
  metrics: 'Fink 2000 Arch Intern Med: Sn 68% (60–76), Sp 75% (68–82), LR+ 2.7, LR− 0.43; Sn 82% for AAA ≥ 5.0 cm; Sn 91% if girth < 100 cm vs 53% if ≥ 100 cm.'
  evidence: M
  sources:
  - text: Fink 2000 Arch Intern Med
    url: https://doi.org/10.1001/archinte.160.6.833
    free_full_text: false
  review_status: approved
- id: axial-spa-asas
  type: info
  title: Axial Spondyloarthritis (ASAS Classification Criteria)
  page: 1
  summary: Screening and classification criteria for axial spondyloarthritis (axSpA) in patients with chronic back pain.
  steps:
  - 'Screen inflammatory back pain features: insidious onset, morning stiffness improving with exercise, no improvement with rest, and awakening in the second half of the night.'
  - 'Assess imaging arm (sacroiliitis on MRI or radiographs plus SpA feature) and clinical arm (HLA serology positive plus SpA features: enthesitis, uveitis, dactylitis, psoriasis, IBD, family history, good NSAID response, elevated CRP).'
  - Refer suspected axial spondyloarthritis to rheumatology for diagnostic confirmation.
  positive: Fulfilment of ASAS imaging or clinical arm criteria in chronic back pain -> rheumatology referral.
  interpretation: Differentiates inflammatory axial spondyloarthritis from non-specific mechanical low back pain.
  metrics: 'Rudwaleit 2011: Sn 79.5%, Sp 83.3%.'
  evidence: M
  sources:
  - text: Rudwaleit 2011
    url: https://doi.org/10.1136/ard.2010.133645
    free_full_text: false
  review_status: approved
- id: spinal-infection-screen
  type: info
  title: Spinal Infection Triage (Discitis / Osteomyelitis / Epidural Abscess)
  page: 1
  summary: Clinical triage for pyogenic or granulomatous spinal infection presenting with relentless back pain.
  steps:
  - 'Screen for systemic infection risk factors: fever, rigors, night sweats, intravenous drug use, immunosuppression, diabetes, recent spinal injection/surgery, or systemic infection.'
  - Assess for constant, severe, non-mechanical spinal pain unrelieved by rest and focal percussion tenderness over spinous processes.
  - Monitor neurological status closely for signs of spinal epidural abscess progression.
  positive: Unremitting spinal pain with fever, infection risk factors, or elevated inflammatory markers -> urgent medical / emergency workup (blood cultures, inflammatory markers, contrast MRI).
  interpretation: Absence of fever does not exclude spinal infection; maintain high suspicion in immunocompromised patients or after invasive procedures.
  metrics: Clinical red-flag synthesis (E).
  evidence: E
  sources: []
  review_status: approved
- id: nice-ng59-imaging
  type: info
  title: Lumbar Imaging Decision Rule (NICE NG59)
  page: 1
  summary: Guideline recommendations against routine lumbar imaging in non-specific low back pain without serious underlying pathology.
  steps:
  - Complete red-flag triage to exclude fracture, malignancy, infection, cauda equina syndrome, or inflammatory spondyloarthritis.
  - Explain to the patient that routine imaging is not needed when serious pathology is not suspected and that incidental age-related imaging findings are common.
  - In specialist settings, consider imaging only if the result is likely to change clinical management.
  positive: '"Do not routinely offer imaging in a non-specialist setting" (1.1.4); consider imaging in specialist settings "only if the result is likely to change management" (1.1.6).'
  interpretation: Routine imaging in non-specific low back pain does not improve clinical outcomes.
  metrics: 'Level: Guideline. NICE NG59: "Do not routinely offer imaging in a non-specialist setting" (1.1.4); consider imaging in specialist settings "only if the result is likely to change management" (1.1.6). Imaging review (reference only, no numbers): Jarvik & Deyo 2002.'
  evidence: Guideline
  sources:
  - text: NICE NG59
    url: https://www.nice.org.uk/guidance/ng59/chapter/Recommendations
    free_full_text: false
  - text: Jarvik & Deyo 2002
    url: https://doi.org/10.7326/0003-4819-137-7-200210010-00010
    free_full_text: false
  review_status: approved
- id: start-back-tool
  type: info
  title: STarT Back Screening Tool & Stratified Care
  page: 2
  summary: 9-item prognostic screening tool stratifying low back pain patients into low, medium, and high risk of persistent disability to match targeted care pathways.
  steps:
  - Administer all 9 items (physical/functional items and psychosocial subscale items 5–9).
  - Calculate the total score (0–9) and the psychosocial subscale score (items 5–9).
  - 'Classify risk group: total 0–3 = low risk; psychosocial subscale (items 5–9) 4–5 = high risk; rest = medium.'
  - 'Match treatment pathway: supported self-management for low risk; evidence-based physiotherapy for medium risk; psychologically informed physiotherapy for high risk.'
  positive: 9 items; total 0–3 = low risk; psychosocial subscale (items 5–9) 4–5 = high risk; rest = medium.
  interpretation: 'NICE NG59 (1.1.2): "Consider using risk stratification (for example, the STarT Back risk assessment tool) at first point of contact". In older adults, predictive validity is poor (AUC 0.65–0.67).'
  metrics: 'Hill 2008: 9 items; total 0–3 = low risk; psychosocial subscale (items 5–9) 4–5 = high risk; rest = medium. Hill 2011 Lancet (STarT Back trial, RCT, n = 851): RMDQ between-group difference 1.81 (1.06–2.57) at 4 months; 1.06 (0.25–1.86) at 12 months. Vigdal 2024 (older adults): predictive validity poor; AUC 0.65–0.67.'
  evidence: H
  calculator:
    kind: formula
    inputs:
    - heading: Physical & functional items
    - key: i1
      label: Back pain has spread down my leg(s) recently
      type: check
    - key: i2
      label: Pain in the shoulder or neck at some time recently
      type: check
    - key: i3
      label: Only walked short distances because of my back pain
      type: check
    - key: i4
      label: Dressed more slowly than usual because of back pain
      type: check
    - heading: Psychosocial subscale (items 5–9)
    - key: i5
      label: It is not really safe for a person with a condition like mine to be physically active
      type: check
    - key: i6
      label: Worrying thoughts have been going through my mind a lot of the time
      type: check
    - key: i7
      label: I feel that my back pain is terrible and is never going to get any better
      type: check
    - key: i8
      label: In general I have not enjoyed all the things I used to enjoy
      type: check
    - key: i9
      label: Overall, how bothersome has your back pain been?
      type: select
      options:
      - - 0
        - 0 · Not at all / Slightly / Moderately
      - - 1
        - 1 · Very much / Extremely
    expr: i1+i2+i3+i4+i5+i6+i7+i8+i9
    value_label: STarT Back total (0–9)
    decimals: 0
    outputs:
    - when: v<=3
      text: Total {v|0}/9 · Psychosocial subscale (items 5–9) {i5+i6+i7+i8+i9|0}/5 → Low risk (total 0–3)
      tone: good
    - when: (i5+i6+i7+i8+i9)>=4
      text: Total {v|0}/9 · Psychosocial subscale (items 5–9) {i5+i6+i7+i8+i9|0}/5 → High risk (psychosocial subscale 4–5)
      tone: bad
    - when: v>=4
      text: Total {v|0}/9 · Psychosocial subscale (items 5–9) {i5+i6+i7+i8+i9|0}/5 → Medium risk
      tone: warn
  sources:
  - text: Hill 2008
    url: https://doi.org/10.1002/art.23563
    free_full_text: false
  - text: Hill 2011 Lancet (STarT Back trial)
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3208163/
    free_full_text: true
  - text: Vigdal 2024
    url: https://doi.org/10.1002/ejp.2281
    free_full_text: false
  - text: NICE NG59
    url: https://www.nice.org.uk/guidance/ng59/chapter/Recommendations
    free_full_text: false
  review_status: approved
- id: ompsq-10
  type: info
  title: Örebro Musculoskeletal Pain Screening Questionnaire Short Form (ÖMPSQ-10)
  page: 2
  summary: Short-form yellow-flag screening questionnaire identifying patients at risk of long-term work disability due to musculoskeletal pain.
  steps:
  - Administer the short-form questionnaire covering pain duration, pain rating, physical function, distress, fear-avoidance, and return-to-work expectations.
  - Sum the item scores (reverse-scoring functional and recovery expectation items per standard scoring).
  - Apply the validated cut-off 50 to identify elevated risk of future work disability.
  positive: Cut-off 50 identified 85% (occupational) / 83% (primary care) of those who developed disability.
  interpretation: Guides early occupational and cognitive-behavioural intervention for yellow flags.
  metrics: 'Linton 2011: correlation with long form 0.91; cut-off 50 identified 85% (occupational) / 83% (primary care) of those who developed disability.'
  evidence: M
  sources:
  - text: Linton 2011
    url: https://doi.org/10.1097/BRS.0b013e3181f8f775
    free_full_text: false
  review_status: approved
- id: lumbar-stenosis-cluster
  type: test
  title: Lumbar Spinal Stenosis Clinical Cluster (Cook)
  page: 2
  summary: 5-item clinical diagnosis support cluster identifying symptomatic lumbar spinal stenosis and neurogenic claudication.
  steps:
  - Assess for bilateral lower-extremity symptoms.
  - Determine whether leg pain is more severe than back pain.
  - Ask if pain occurs during walking or standing.
  - Ask if pain is relieved upon sitting (flexion relief / shopping-cart sign).
  - Record patient age category (older age criterion).
  positive: ≥ 4 of 5 findings → post-test probability 76%.
  interpretation: Distinguishes neurogenic claudication (postural/extension-dependent) from vascular claudication (exertion-dependent, relieved by standing still).
  metrics: 'Cook 2011: ≥ 4 of 5 findings → post-test probability 76%.'
  evidence: L
  sources:
  - text: Cook 2011
    url: https://doi.org/10.1002/pri.500
    free_full_text: false
  review_status: approved
- id: sij-laslett-cluster
  type: test
  title: Sacroiliac Joint (SIJ) Provocation Cluster (Laslett)
  page: 2
  summary: 6-test manual pain provocation composite for ruling in or ruling out the sacroiliac joint as the primary pain generator (after excluding centralisation).
  steps:
  - First screen lumbar repeated movements to exclude discogenic centralisation.
  - Perform Distraction test (supine, posterior-lateral pressure on bilateral ASIS).
  - Perform Thigh Thrust test (supine, hip flexed with posterior shearing force along femur).
  - Perform Compression test (side-lying, downward pressure over uppermost iliac crest).
  - Perform Sacral Thrust test (prone, anterior-directed force over mid-sacrum).
  - Perform Gaenslen test bilaterally (supine, maximal hip flexion on one side with contralateral hip extension over plinth edge).
  positive: '≥ 3 of 6 tests: Sn 94%, Sp 78%; any 2 of the best 4 tests: AUC 0.842; all 6 negative → SIJ ruled out.'
  interpretation: When all 6 provocation tests are negative, symptomatic SIJ dysfunction is ruled out.
  metrics: 'Laslett 2005: ≥ 3 of 6 tests: Sn 94%, Sp 78%; any 2 of the best 4 tests: AUC 0.842; all 6 negative → SIJ ruled out.'
  evidence: M
  sources:
  - text: Laslett 2005
    url: https://doi.org/10.1016/j.math.2005.01.003
    free_full_text: false
  review_status: approved
- id: one-legged-hyperextension-test
  type: test
  title: One-Legged Hyperextension Test (Stork Test) — Spondylolysis
  page: 2
  summary: Single-leg standing lumbar extension maneuver historically used for pars interarticularis stress injury, shown to lack diagnostic accuracy.
  steps:
  - Patient stands on one leg while lifting the opposite foot off the floor.
  - Instruct the patient to extend the lumbar spine slowly while balancing on the single stance leg.
  - Repeat standing on the contralateral leg and note pain reproduction.
  positive: '"neither sensitive nor specific" for active spondylolysis.'
  interpretation: Do not rely on the one-legged hyperextension test to diagnose or rule out active spondylolysis; rely on adolescent clinical history and appropriate imaging when indicated.
  metrics: 'Masci 2006 BJSM: "neither sensitive nor specific" for active spondylolysis — no numbers.'
  evidence: L
  sources:
  - text: Masci 2006 BJSM
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2465027/
    free_full_text: true
  review_status: approved
- id: waddell-signs
  type: info
  title: Waddell Non-Organic Signs — Clinical Interpretation & Caution
  page: 2
  summary: Behavioural physical examination responses (tenderness, simulation, distraction, regional disturbances, overreaction) and evidence-based cautions against misuse.
  steps:
  - 'Observe behavioural responses during physical examination: superficial/non-anatomical tenderness, axial loading/pelvic rotation simulation, seated vs supine SLR distraction, non-neuroanatomical sensory/motor changes, and disproportionate verbal/facial reaction.'
  - Interpret positive signs as markers of severe pain, fear, or lower functional status rather than malingering.
  - Never use Waddell signs to dismiss organic pathology or infer secondary gain.
  positive: Associated with lower function, poorer non-surgical outcome and more pain; NOT evidence of secondary gain or psychological distress; cannot separate organic from non-organic.
  interpretation: Use as a clinical cue to address pain severity and fear-avoidance rather than questioning symptom validity.
  metrics: 'Fishbain 2003 review: associated with lower function, poorer non-surgical outcome and more pain; NOT evidence of secondary gain or psychological distress; cannot separate organic from non-organic — no numbers.'
  evidence: M
  sources:
  - text: Fishbain 2003 review
    url: https://doi.org/10.1046/j.1526-4637.2003.03015.x
    free_full_text: false
  review_status: approved
- id: tbc-classification
  type: info
  title: Treatment-Based Classification (TBC)
  page: 2
  summary: Subgrouping system matching acute/subacute low back pain presentations to directional preference/specific exercise, manipulation, stabilisation, or traction.
  steps:
  - Evaluate baseline symptoms, symptom distribution, repeated movement response (centralisation / directional preference), segmental mobility, and instability signs.
  - Assign the patient to the matching primary rehabilitation subgroup (specific exercise / directional preference, manipulation, or stabilisation).
  - Re-assess subgroup classification as symptoms and functional status evolve.
  positive: 'TBC group: greater Oswestry change at 4 weeks (P = 0.023) and better return to full duty (P = 0.017) vs guideline-based care.'
  interpretation: Provides a structured clinical reasoning framework linking objective examination findings directly to initial treatment selection.
  metrics: 'Fritz 2003: TBC group: greater Oswestry change at 4 weeks (P = 0.023) and better return to full duty (P = 0.017) vs guideline-based care.'
  evidence: M
  sources:
  - text: Fritz 2003
    url: https://doi.org/10.1097/01.BRS.0000067115.61673.ff
    free_full_text: false
  review_status: approved
- id: mckenzie-directional-preference
  type: test
  title: McKenzie Directional Preference (DP) & Centralisation
  page: 2
  summary: Repeated end-range spinal movement testing identifying a specific movement direction that centralises distal pain or decreases symptom intensity.
  steps:
  - Record baseline pain location (most distal extent) and intensity prior to movement testing.
  - Perform repeated end-range lumbar movements in standing and lying (extension, flexion, and lateral shift/side-glide as indicated).
  - Monitor whether distal leg/buttock symptoms progressively retreat toward the lumbar midline (centralisation) or whether pain abates and ROM improves (directional preference).
  - Prescribe exercises matching the identified directional preference.
  positive: DP elicited in 74% (230) of subjects; exercises matching the DP improved every outcome vs opposite / non-directional.
  interpretation: Peripheralisation (proximal-to-distal spread of pain into the limb) during repeated movements indicates an avoided direction.
  metrics: 'Long 2004: DP elicited in 74% (230) of subjects; exercises matching the DP improved every outcome vs opposite / non-directional.'
  evidence: M
  sources:
  - text: Long 2004
    url: https://doi.org/10.1097/01.brs.0000146464.23007.2a
    free_full_text: false
  review_status: approved
- id: lumbar-rom-assessment
  type: test
  title: Lumbar Range of Motion & Repeated Movement Assessment
  page: 3
  summary: Inclinometer or tape-measure assessment of active lumbar flexion, extension, lateral flexion, and rotation, alongside symptom response.
  steps:
  - Stand the patient barefoot with feet shoulder-width apart and expose the lumbosacral spine.
  - Measure active flexion, extension, and left/right lateral flexion using an inclinometer or fingertip-to-floor / modified Schober method.
  - Record the patient's individual baseline values, symptom reproduction, and whether repeated movements centralise or peripheralise pain.
  positive: lumbar flexion ≥ 53° OR no hypomobility on segmental testing → LR+ 4.3 (1.8–10.6) for radiographic instability.
  interpretation: Compare against the patient's own baseline across sessions (no normative cut-offs applied).
  metrics: 'Fritz 2005 Eur Spine J: lumbar flexion ≥ 53° OR no hypomobility on segmental testing → LR+ 4.3 (1.8–10.6).'
  evidence: L
  sources:
  - text: Fritz 2005 Eur Spine J
    url: https://doi.org/10.1007/s00586-004-0803-4
    free_full_text: false
  review_status: approved
- id: lower-limb-neuro-screen
  type: test
  title: Lower-Limb Neurological Examination (L2–S1 Grid)
  page: 3
  summary: Systematic root-level neurological examination of L2–S1 dermatomes, myotomes, and deep tendon reflexes.
  steps:
  - 'Sensory (dermatomes): test light touch and pinprick bilaterally across L2 (anteromedial thigh), L3 (medial femoral condyle), L4 (medial malleolus), L5 (dorsum of foot / great toe web space), and S1 (lateral heel / lateral foot), plus perineal saddle area when indicated.'
  - 'Motor (myotomes): test isometric strength and functional heel/toe walking across L2 (hip flexion — iliopsoas), L3 (knee extension — quadriceps), L4 (ankle dorsiflexion — tibialis anterior), L5 (great toe extension — extensor hallucis longus), and S1 (ankle plantarflexion — gastrocnemius/soleus).'
  - 'Reflexes: grade patellar tendon reflex (L3–L4) and Achilles tendon reflex (S1), and screen plantar response (Babinski) / clonus for upper motor neuron signs.'
  positive: Dermatomal hypoesthesia/anaesthesia, myotomal paresis, or diminished/absent deep tendon reflex concordant with a spinal nerve root level.
  interpretation: Combine sensory, motor, and reflex findings with neurodynamic tests; monitor serial motor strength closely for progressive deficit.
  metrics: Standard neurological examination grid — for mid-lumbar and low-lumbar reflex/stretch accuracy values see Suri 2011 Spine cards on Page 4.
  evidence: E
  sources: []
  review_status: approved
- id: segmental-mobility-testing
  type: test
  title: Segmental Mobility Testing & Interspinous Gap Change
  page: 3
  summary: Passive accessory posteroanterior (PA) spring testing and passive physiological intervertebral motion (PPIVM) interspinous gap palpation across the lumbar spine.
  steps:
  - 'PA spring test: with patient prone, apply graded posteroanterior pressure over each lumbar spinous process using the pisiform/hypothenar eminence; note pain provocation and perceived stiffness.'
  - 'Interspinous gap change test: with patient side-lying facing the examiner, flex hips and knees and palpate the interspinous spaces while passively flexing and extending the lower limbs through the lumbar segments.'
  - Compare segmental pain provocation (more reliable) against perceived segmental motion (poor inter-rater reliability).
  positive: Segmental pain provocation reproduces familiar pain; absence of hypomobility on segmental testing contributes to the Fritz radiographic instability rule.
  interpretation: Judgements of segmental mobility are not reliable (κ −0.02 to 0.26) — rely primarily on pain provocation (κ 0.25–0.55) and combine with clinical prediction rules.
  metrics: 'Hicks 2003: κ −0.02 to 0.26 (not reliable); pain provocation κ 0.25–0.55. Fritz 2005 Eur Spine J: lumbar flexion ≥ 53° OR no hypomobility on segmental testing → LR+ 4.3 (1.8–10.6).'
  evidence: L
  video_url: https://www.youtube.com/watch?v=Jk1MxlQ98Us
  video_title: Interspinous Gap Change Test (Physiotutors)
  sources:
  - text: Hicks 2003
    url: https://doi.org/10.1016/S0003-9993(03)00365-4
    free_full_text: false
  - text: Fritz 2005 Eur Spine J
    url: https://doi.org/10.1007/s00586-004-0803-4
    free_full_text: false
  review_status: approved
- id: prone-instability-test
  type: test
  title: Prone Instability Test (PIT)
  page: 3
  summary: Active extensor recruitment provocation test evaluating whether lumbar segmental pain on posteroanterior pressure subsides when the posterior musculature is contracted.
  steps:
  - Patient lies prone with the trunk on the examination plinth and legs over the edge, feet resting on the floor.
  - Apply posteroanterior (PA) pressure to each lumbar spinous process and identify any painful segment.
  - At the painful level, ask the patient to lift both feet slightly off the floor (holding the table edges) to activate the spinal extensors.
  - Re-apply the same PA pressure while the extensors are actively contracted.
  positive: Familiar lumbar pain provoked with resting PA pressure (feet on floor) that substantially subsides or disappears when the feet are lifted off the floor.
  interpretation: Included in the Hicks stabilisation CPR, but inter-rater reliability is inconsistent between studies — interpret alongside other instability findings.
  metrics: 'Reliability: κ = 0.87 (Hicks 2003) BUT κ = 0.10 (−0.27 to 0.47) in a later study (Ravenna 2011) — reliability inconsistent.'
  evidence: L
  video_url: https://www.youtube.com/watch?v=OrgoC3mKhXQ
  video_title: Prone Instability Test (Physiotutors)
  sources:
  - text: Hicks 2003
    url: https://doi.org/10.1016/S0003-9993(03)00365-4
    free_full_text: false
  - text: Ravenna 2011
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3104326/
    free_full_text: true
  review_status: approved
- id: passive-lumbar-extension-test
  type: test
  title: Passive Lumbar Extension Test (PLET)
  page: 3
  summary: Clinical test for structural lumbar segmental instability performed by passively elevating both extended lower extremities in prone.
  steps:
  - Position the patient prone on the plinth with both lower extremities extended.
  - Examiner grasps both ankles/distal lower legs and passively elevates both legs simultaneously to extend the lumbar spine while applying gentle caudal traction.
  - Maintain passive elevation briefly, then return the legs to the plinth and query symptom response.
  positive: Sn 84.2%, Sp 90.4%, LR+ 8.84 (4.51–17.33) — reproduction of severe, heavy lumbar pain during passive bilateral leg elevation that disappears when returned to the starting position.
  interpretation: Confirmed by systematic review (Alqarni 2011) as the most accurate clinical test for radiographic lumbar segmental instability.
  metrics: 'Kasai 2006: Sn 84.2%, Sp 90.4%, LR+ 8.84 (4.51–17.33). Review confirming it as most accurate: Alqarni 2011.'
  evidence: L
  video_url: https://www.youtube.com/watch?v=2OyQGH9vzok
  video_title: Passive Lumbar Extension Test (PLET) (Physiotutors)
  sources:
  - text: Kasai 2006
    url: https://doi.org/10.2522/ptj.20050281
    free_full_text: false
  - text: Alqarni 2011
    url: https://doi.org/10.2519/jospt.2011.3457
    free_full_text: false
  review_status: approved
- id: fritz-instability-predictors
  type: info
  title: Radiographic Lumbar Instability Predictors (Fritz)
  page: 3
  summary: Clinical rule predicting radiographic lumbar segmental instability on flexion-extension radiographs.
  steps:
  - Measure total lumbar flexion range of motion using an inclinometer.
  - Perform prone posteroanterior segmental mobility testing across the lumbar spine to determine if any segment is hypomobile.
  - Check whether lumbar flexion is ≥ 53° OR there is no hypomobility on segmental testing.
  positive: lumbar flexion ≥ 53° OR no hypomobility on segmental testing → LR+ 4.3 (1.8–10.6).
  interpretation: Increases the likelihood of radiographic lumbar instability and supports motor control / stabilisation selection.
  metrics: 'Fritz 2005 Eur Spine J: lumbar flexion ≥ 53° OR no hypomobility on segmental testing → LR+ 4.3 (1.8–10.6).'
  evidence: L
  sources:
  - text: Fritz 2005 Eur Spine J
    url: https://doi.org/10.1007/s00586-004-0803-4
    free_full_text: false
  review_status: approved
- id: mcgill-endurance-battery
  type: test
  title: McGill Trunk Muscular Endurance Battery (Ratios)
  page: 3
  summary: Isometric trunk endurance battery comparing flexor, lateral musculature (right/left side bridge), and back extensor hold times via balance ratios rather than raw seconds.
  steps:
  - 'Trunk flexor test: patient sits with trunk supported on an angled wedge, knees flexed and feet secured; remove wedge and time isometric hold until posture deviates.'
  - 'Side bridge test (left and right): patient in side-lying propped on elbow and feet; lift pelvis into a straight line and time isometric hold on each side.'
  - 'Back extensor test (Biering-Sørensen position): upper body cantilevered over plinth edge with pelvis/legs strapped; hold horizontal and time until loss of horizontal position.'
  - 'Compute endurance ratios: side bridge / extensor, flexor / extensor, and right / left side bridge.'
  positive: men side bridge = 65% of extensor time, 99% of flexor time; women 39% and 79% — ratios only, no second norms.
  interpretation: Evaluate balance ratios between muscle groups rather than absolute hold times in seconds.
  metrics: 'McGill 1999: reliability > 0.97; men side bridge = 65% of extensor time, 99% of flexor time; women 39% and 79% — ratios only, no second norms.'
  evidence: L
  video_url: https://www.youtube.com/watch?v=grKVX0EozmQ
  video_title: McGill Torso Muscular Endurance Test Battery (Robert Brown III)
  sources:
  - text: McGill 1999
    url: https://doi.org/10.1016/S0003-9993(99)90087-4
    free_full_text: false
  review_status: approved
- id: biering-sorensen-test
  type: test
  title: Biering-Sørensen Isometric Back-Extensor Endurance Test
  page: 3
  summary: Prone cantilevered isometric hold assessing posterior trunk and hip extensor muscular endurance.
  steps:
  - Position the patient prone with the upper border of the iliac crests aligned with the edge of the examination plinth.
  - Secure the pelvis, knees, and ankles to the plinth with straps while the trunk is supported on a chair/stool.
  - Ask the patient to fold arms across the chest, hold the trunk horizontal, and maintain the isometric position until fatigue or symptom limit.
  positive: good isometric back-extensor endurance may prevent first-time LBP in men — no second norms.
  interpretation: Track change against the patient's own baseline without applying a fixed seconds cut-off.
  metrics: 'Biering-Sørensen 1984: good isometric back-extensor endurance may prevent first-time LBP in men — no second norms.'
  evidence: L
  sources:
  - text: Biering-Sørensen 1984
    url: https://doi.org/10.1097/00007632-198403000-00002
    free_full_text: false
  review_status: approved
- id: aberrant-movement-patterns
  type: test
  title: Aberrant Lumbar Movement Patterns Checklist
  page: 3
  summary: Observation of qualitative movement control faults during active standing lumbar flexion and return to upright posture.
  steps:
  - Ask the patient to bend forward as far as comfortable and return to upright standing.
  - Observe for Painful Arc in Flexion (symptoms felt at mid-range that disappear at end-range) or Painful Arc on Return.
  - Observe for Instability Catch (sudden acceleration/deceleration, shudder, or lateral deviation from the sagittal plane).
  - Observe for Gower Sign / Thigh Climbing (pushing hands on thighs to assist return to upright) and Reversal of Lumbopelvic Rhythm (flexing knees and shifting pelvis anteriorly before extending spine).
  positive: Presence of aberrant movement patterns during flexion or return from flexion.
  interpretation: Key clinical predictor in the Hicks stabilisation clinical prediction rule indicating impaired dynamic lumbopelvic motor control.
  metrics: 'Hicks 2005: aberrant motions are a key variable in the stabilisation CPR (success LR+ 4.0; failure LR− 0.18).'
  evidence: L
  sources:
  - text: Hicks 2005
    url: https://doi.org/10.1016/j.apmr.2005.03.033
    free_full_text: false
  review_status: approved
- id: slr-test
  type: test
  title: Straight Leg Raise (SLR) Test
  page: 4
  summary: Passive supine lower-limb elevation testing mechanosensitivity and radicular tension of the lower lumbar / sacral nerve roots (sciatic nerve).
  steps:
  - Position the patient supine in neutral alignment without a pillow if tolerated.
  - Grasp the patient's heel with one hand while maintaining full knee extension with the other hand.
  - Passively flex the hip slowly while keeping the knee extended until radicular leg symptoms are reproduced.
  - Confirm neural involvement with structural differentiation (ankle dorsiflexion or neck flexion sensitises; slight hip lowering relieves).
  positive: 'Cochrane (mostly surgical samples): Sn 0.92 (0.87–0.95), Sp 0.28 (0.18–0.40). Slump vs SLR (Majlesi 2008): Slump Sn 0.84, Sp 0.83; SLR Sn 0.52, Sp 0.89.'
  interpretation: High sensitivity in surgical cohorts makes a negative SLR useful for reducing likelihood of disc-related radiculopathy, while specificity is low; in Majlesi 2008, Slump was more sensitive than SLR.
  metrics: 'van der Windt 2010 (Cochrane, mostly surgical samples): Sn 0.92 (0.87–0.95), Sp 0.28 (0.18–0.40). Majlesi 2008 (Slump vs SLR): Slump Sn 0.84, Sp 0.83; SLR Sn 0.52, Sp 0.89.'
  evidence: M
  video_url: https://www.youtube.com/watch?v=LdAD9GNv8FI
  video_title: Straight Leg Raise (SLR) / Lasègue Test (Physiotutors)
  sources:
  - text: van der Windt 2010
    url: https://doi.org/10.1002/14651858.CD007431.pub2
    free_full_text: false
  - text: Majlesi 2008
    url: https://doi.org/10.1097/RHU.0b013e31816b2f99
    free_full_text: false
  review_status: approved
- id: crossed-slr-test
  type: test
  title: Crossed Straight Leg Raise (Well-Leg Raise) Test
  page: 4
  summary: Passive straight leg raise of the asymptomatic limb testing for central / large lumbar disc herniation.
  steps:
  - Position the patient supine with legs extended.
  - Perform a passive straight leg raise on the ASYMPTOMATIC (contralateral) lower extremity.
  - Ask the patient if symptoms are reproduced in the SYMPTOMATIC leg.
  positive: Sp 0.90 (0.85–0.94), Sn 0.28 (0.22–0.35) — elevating the asymptomatic leg reproduces concordant radicular pain down the symptomatic contralateral leg.
  interpretation: High specificity (Sp 0.90) but low sensitivity — a positive crossed SLR supports disc herniation with nerve-root involvement; a negative test does not rule it out. Data come mostly from surgical samples.
  metrics: 'van der Windt 2010: Sp 0.90 (0.85–0.94), Sn 0.28 (0.22–0.35).'
  evidence: M
  video_url: https://www.youtube.com/watch?v=Yp7es4deo0Q
  video_title: Crossed Straight Leg Raise Test (Physiotutors)
  sources:
  - text: van der Windt 2010
    url: https://doi.org/10.1002/14651858.CD007431.pub2
    free_full_text: false
  review_status: approved
- id: slump-test
  type: test
  title: Slump Test
  page: 4
  summary: Seated sequential neurodynamic tension test combining thoracolumbar slump, cervical flexion, knee extension, and ankle dorsiflexion.
  steps:
  - Patient sits upright at the plinth edge with thighs fully supported and hands behind the back.
  - Instruct the patient to slump the thoracic and lumbar spine into flexion while keeping the head neutral.
  - Ask the patient to flex the chin to the chest; examiner maintains gentle overpressure.
  - Passively or actively extend the tested knee and add ankle dorsiflexion.
  - 'Structural differentiation: ask the patient to extend the neck — alteration of distal leg symptoms confirms neural mechanosensitivity.'
  positive: Slump Sn 0.84, Sp 0.83; SLR Sn 0.52, Sp 0.89 (Majlesi 2008).
  interpretation: More sensitive than the supine Straight Leg Raise in patients with lumbar disc herniation (Majlesi 2008).
  metrics: 'Majlesi 2008 (Slump vs SLR): Slump Sn 0.84, Sp 0.83; SLR Sn 0.52, Sp 0.89.'
  evidence: L
  video_url: https://www.youtube.com/watch?v=KPwQNiqg_38
  video_title: Slump Test (Mark Sleeper)
  sources:
  - text: Majlesi 2008
    url: https://doi.org/10.1097/RHU.0b013e31816b2f99
    free_full_text: false
  review_status: approved
- id: femoral-stretch-pkb
  type: test
  title: Femoral Stretch Test (Prone Knee Bend / PKB)
  page: 4
  summary: Prone or side-lying neurodynamic provocation test for mid-lumbar nerve root impingement (femoral nerve).
  steps:
  - Position the patient prone (or side-lying) with the pelvis stabilised against the plinth to prevent anterior pelvic tilt.
  - Passively flex the patient's knee toward the buttock; add gentle hip extension if needed.
  - Differentiate anterior thigh rectus femoris muscle stretch from sharp radicular anterior thigh/leg pain, and combine with patellar tendon reflex testing.
  positive: 'mid-lumbar impingement: FST + patellar reflex LR 7.0 (2.3–21); FST at L3 LR 5.7.'
  interpretation: High positive likelihood ratio for mid-lumbar (especially L3) nerve root impingement, particularly when combined with an impaired patellar reflex.
  metrics: 'Suri 2011 Spine: mid-lumbar impingement: FST + patellar reflex LR 7.0 (2.3–21); FST at L3 LR 5.7.'
  evidence: L
  video_url: https://www.youtube.com/watch?v=4VxKyPRq6HA
  video_title: Prone Knee Bend / Reversed Lasègue Test (Physiotutors)
  sources:
  - text: Suri 2011 Spine
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2978791/
    free_full_text: true
  review_status: approved
- id: achilles-reflex-test
  type: test
  title: Achilles Tendon Reflex (Ankle Jerk)
  page: 4
  summary: Deep tendon reflex assessment of the S1 nerve root for low-lumbar nerve root impingement.
  steps:
  - Position the patient seated, supine, or kneeling with the ankle relaxed and held in slight passive dorsiflexion.
  - Strike the Achilles tendon briskly with a reflex hammer and observe/palpate gastrocnemius-soleus plantarflexion response.
  - Compare amplitude and symmetry directly against the contralateral ankle (use Jendrassik reinforcement if bilaterally diminished).
  positive: low-lumbar impingement LR 7.1 (0.96–53) when asymmetrically diminished or absent.
  interpretation: Point estimate favours low-lumbar nerve root impingement, but the confidence interval is wide (0.96–53) — interpret together with myotomes, dermatomes and neurodynamic tests.
  metrics: 'Suri 2011 Spine: low-lumbar impingement LR 7.1 (0.96–53).'
  evidence: L
  sources:
  - text: Suri 2011 Spine
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2978791/
    free_full_text: true
  review_status: approved
- id: manipulation-cpr-flynn-childs
  type: info
  title: Lumbar Manipulation Clinical Prediction Rule (Flynn / Childs)
  page: 4
  summary: 5-criterion clinical prediction rule identifying patients with non-radicular low back pain most likely to achieve rapid improvement from lumbopelvic thrust manipulation plus exercise.
  steps:
  - Acute / recent onset of current low back pain episode.
  - No symptoms extending distal to the knee.
  - Low fear-avoidance beliefs on the FABQ-work subscale.
  - At least one hypomobile lumbar motion segment on posteroanterior spring testing.
  - Adequate hip internal rotation range of motion in at least one hip.
  positive: '5 criteria; ≥ 4/5 → LR+ 24.38; probability of success 45% → 95% (Flynn 2002). Rule-positive + manipulation: OR 60.8 (5.2–704.7); 92% chance of success; NNT 1.9 (1.4–3.5) at 4 weeks (Childs 2004).'
  interpretation: Per NICE NG59 (1.2.7, amended 2026), offer spinal manipulation only as part of a treatment package that includes exercise.
  metrics: 'Flynn 2002 (derivation): 5 criteria; ≥ 4/5 → LR+ 24.38; probability of success 45% → 95%. Childs 2004 (validation): rule-positive + manipulation: OR 60.8 (5.2–704.7); 92% chance of success; NNT 1.9 (1.4–3.5) at 4 weeks.'
  evidence: M
  sources:
  - text: Flynn 2002
    url: https://doi.org/10.1097/00007632-200212150-00021
    free_full_text: false
  - text: Childs 2004
    url: https://doi.org/10.7326/0003-4819-141-12-200412210-00008
    free_full_text: false
  review_status: approved
- id: stabilisation-cpr-hicks
  type: info
  title: Lumbar Stabilisation Clinical Prediction Rule (Hicks)
  page: 4
  summary: Clinical prediction rule identifying patients with low back pain who respond favourably (or fail to respond) to a lumbar stabilisation exercise programme.
  steps:
  - Assess patient age (younger age variable).
  - Measure passive Straight Leg Raise (SLR) range of motion.
  - Perform the Prone Instability Test (PIT).
  - Observe active trunk flexion/return for aberrant motions (instability catch, painful arc, thigh climbing, reversal of lumbopelvic rhythm).
  - Evaluate lumbar segmental hypermobility and fear-avoidance beliefs.
  positive: 'success LR+ 4.0; failure LR− 0.18; key variables: age, SLR, prone instability test, aberrant motions, hypermobility, fear-avoidance.'
  interpretation: Helps target motor control and trunk stabilisation programmes toward patients with clinical features of segmental instability.
  metrics: 'Hicks 2005: success LR+ 4.0; failure LR− 0.18; key variables: age, SLR, prone instability test, aberrant motions, hypermobility, fear-avoidance.'
  evidence: L
  sources:
  - text: Hicks 2005
    url: https://doi.org/10.1016/j.apmr.2005.03.033
    free_full_text: false
  review_status: approved
- id: odi
  type: info
  title: Oswestry Disability Index (ODI) / Modified Oswestry
  page: 4
  summary: 10-section condition-specific disability questionnaire for low back pain, scored 0–5 per item and multiplied by 2 to yield a percentage disability score.
  steps:
  - Patient completes the 10 sections (pain intensity, personal care, lifting, walking, sitting, standing, sleeping, homemaking / sex life, social life, travelling).
  - Each section is scored from 0 (no disability) to 5 (maximal disability).
  - When all 10 sections are answered, sum the item scores and multiply by 2 to obtain the percentage disability score.
  positive: 'MIC consensus (Ostelo 2008): ODI 10 or 30% improvement from baseline. Modified Oswestry (Fritz 2001): MCID ≈ 6 points.'
  interpretation: Primary functional outcome measure across non-surgical and post-surgical lumbar spine rehabilitation.
  metrics: 'Ostelo 2008 (MIC consensus): VAS 15; NRS 2; RMDQ 5; ODI 10; or 30% improvement from baseline. Fritz 2001 (Modified Oswestry): MCID ≈ 6 points.'
