- id: rmdq
  type: info
  title: Roland-Morris Disability Questionnaire (RMDQ)
  page: 4
  summary: 24-item yes/no self-report questionnaire measuring daily physical disability due to low back pain.
  steps:
  - Ask the patient to mark each of the 24 statements that applies to them today because of their back pain (Yes = 1, No = 0).
  - Sum the ticked statements to obtain a total score across the 24 items.
  - Re-administer at follow-up and compare change against baseline.
  positive: 'MIC consensus (Ostelo 2008): RMDQ 5 or 30% improvement from baseline. Jordan 2006: clinical improvement = 30% reduction from baseline + better on global rating.'
  interpretation: Highly responsive to change in acute, subacute, and mild-to-moderate low back pain.
  metrics: 'Ostelo 2008 (MIC consensus): VAS 15; NRS 2; RMDQ 5; ODI 10; or 30% improvement from baseline. Jordan 2006: clinical improvement = 30% reduction from baseline + better on global rating.'
