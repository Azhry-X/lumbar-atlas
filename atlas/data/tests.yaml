- id: pain-monitoring-model
  title: Pain-Monitoring Model & Activity Modification
  type: info
  page: 8
  review_status: draft
  summary: Pain-monitoring model principles and zone boundaries for exercise and functional loading progression.
  steps:
  - Instruct patient to monitor pain during and immediately after exercise and functional loading.
  - Maintain pain at or below 5/10 on the NPRS during loading.
  - Verify that symptoms return to pre-activity baseline levels by the following morning.
  - Classify daily activities and exercises into Avoid, Modify, or OK categories based on symptom response.
  positive: Controlled loading without symptom flare-up or morning latency increase.
  interpretation: Sprague 2021 established that pain should not exceed 5/10 on the NPRS during or immediately after activity and should return to pre-activity levels by the following morning; Cavaggion 2024 noted that low (0–2), acceptable (2–5) and high (5–10) risk zones were based on clinical experience; Silbernagel 2007 demonstrated that continued loading with a pain-monitoring model showed no negative effects.
  metrics: Pain ≤ 5/10 during/after, return to baseline by following morning (Sprague 2021); Zones low 0–2, acceptable 2–5, high 5–10 from clinical experience (Cavaggion 2024); Continued loading safe (Silbernagel 2007)
  evidence: E
  sources:
