- id: spondylolysis-rts
  title: Spondylolysis Return to Sport Progression
  type: info
  page: 8
  review_status: draft
  summary: Return to sport timelines and management strategies for athletes with lumbar spondylolysis or low-grade spondylolisthesis.
  steps:
  - Initiate progressive physical therapy early; evaluate clinical symptoms and radiographic healing.
  - 'Guide rehabilitation based on management pathway: conservative vs surgical repair.'
  - Screen for bone healing and symptom resolution before initiating sport-specific impact or extension loading.
  - In surgical or high-grade cases, prohibit collision sports until stable bony union is confirmed.
  positive: Successful return to sport at pre-injury level without recurrence.
  interpretation: Selhorst 2026 showed immediate physical therapy yielded greater early improvement, quicker return to sport and lower LBP recurrence than rest before PT in adolescent athletes; Panteliadis 2016 reported return to sport weighted means of conservative 3.7 months and surgical repair 7.9 months; Grazina 2019 reported return to sports at 6.8 months after surgery for failed conservative care; Bouras 2015 noted return to play 6 to 12 months with collision sports prohibited after surgery.
  metrics: Immediate PT quicker RTS, lower recurrence (Selhorst 2026); Conservative 3.7 mo, surgical 7.9 mo (Panteliadis 2016); Surgical RTS 6.8 mo (Grazina 2019); RTS 6 to 12 mo, collision sports prohibited (Bouras 2015)
