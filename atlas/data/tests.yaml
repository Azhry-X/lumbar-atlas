- id: hhd-strength
  title: Hand-Held Dynamometry (HHD) Strength & Torque Calculator
  type: info
  page: 3
  review_status: draft
  summary: Standardised hand-held dynamometry (HHD) force and torque (N·m = N × m) measurement for hip abduction, hip extension, and trunk extension.
  steps:
  - Use the same device, same position, same strap / lever-arm point and, where possible, the same tester at every visit; compare with the other side (Martins 2017; Batista 2024).
  - Measure lever arm in cm (convert to m = cm ÷ 100) and peak force in Newtons (N) on involved and uninvolved sides.
  - Calculate Torque (N·m) = Force (N) × Lever arm (m) and Limb Symmetry Index (LSI % = involved ÷ uninvolved × 100).
  positive: Consistent test set-up allows reliable longitudinal tracking; side-to-side comparison guides rehabilitation progression.
  interpretation: Batista 2024 showed belt-stabilised HHD peak torque ICC 0.848–0.899 and tension dynamometry ICC 0.848–0.942, but noted disagreement with isokinetic dynamometry; Martins 2017 found r = 0.60–0.90 between belt-stabilised HHD and isokinetic dynamometry with knee differences of 7.5 to 24.7 Nm, confirming the devices cannot be interchanged.
  metrics: Belt-stabilised HHD ICC 0.848–0.899 (Batista 2024); HHD vs isokinetic r = 0.60–0.90, diff 7.5 to 24.7 Nm (Martins 2017)
  evidence: M
  calculator:
    decimals: 1
    expr: f_inv * lever / 100
    inputs:
    - key: f_inv
      label: Involved force (N)
      type: number
    - key: f_uninv
      label: Uninvolved force (N)
      type: number
    - key: lever
      label: Lever arm (cm)
      type: number
    kind: formula
    outputs:
    - text: 'Uninvolved torque: {f_uninv*lever/100|1} N·m · LSI: {f_inv/f_uninv*100|1}%'
      tone: good
      when: isFinite(f_inv) && isFinite(f_uninv) && f_uninv>0 && isFinite(lever)
    value_label: Involved torque (N·m) = N × cm ÷ 100
  sources:
  - text: Batista 2024 Phys Ther Sport
    url: https://doi.org/10.1016/j.ptsp.2024.07.004
    free_full_text: false
  - text: Martins 2017 J Athl Train
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5634229/
    free_full_text: true
- id: post-op-progression-criteria
  title: Post-Operative Progression Criteria & Lumbar Surgery Evidence
  type: info
  page: 5
  review_status: draft
  summary: Post-operative rehabilitation evidence and objective clinical progression criteria checklist.
  steps:
  - Confirm surgeon clearance and verify that post-operative restrictions remain surgeon-directed.
  - Inspect surgical wound healing and screen for infection or complications.
  - Check pain tolerance within acceptable traffic light zones on page 8.
  - Compare range of motion and strength LSI against the contralateral limb.
  - Assess movement quality and evaluate patient confidence before advancing loading.
  positive: All criteria satisfied before advancing to the next rehabilitation phase.
  interpretation: Oosterhuis 2014 found active rehabilitation after lumbar disc surgery showed no increase in reoperation rate, with no differences between supervised and home exercise; Rushton 2012 found physiotherapy after lumbar fusion showed pooled SMD 0.72 (−0.25 to 1.69) at 6 months and 0.52 (−0.45 to 1.49) long term; Greenwood 2016 noted 40 % have significant disability 12 months after fusion, with complex rehab reducing disability (−0.85 short term, −0.84 long term) and fear avoidance (−1.07, −1.40). POST-OP RESTRICTIONS ARE SURGEON-DIRECTED.
  metrics: Disc surgery reoperation rate no increase (Oosterhuis 2014); Fusion physio SMD 0.72 (−0.25 to 1.69) at 6 mo, 0.52 (−0.45 to 1.49) long term (Rushton 2012); 40 % disability at 12 mo (Greenwood 2016)
