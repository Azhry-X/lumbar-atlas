  - Sum all 11 items (higher score = greater kinesiophobia).
  - Use elevated items to guide behavioural experiments and graded exposure.
  positive: 'Woby 2005: reduction ≥ 4 points = important change; ICC 0.81, SEM 2.54.'
  interpretation: Reliable brief screen for pain-related fear; track longitudinal reduction during cognitive functional therapy or graded exercise.
  metrics: 'Woby 2005: reduction ≥ 4 points = important change; ICC 0.81, SEM 2.54.'
