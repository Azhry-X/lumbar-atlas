- id: spondylolysis-rts-sweeney
  type: info
  title: 'Adolescent Spondylolysis: Immediate Physical Therapy & Return to Sport'
  page: 8
  summary: Prospective evidence on immediate physical therapy, MRI bony healing at 3 months, and recurrence rates in adolescent athletes with active lumbar spondylolysis.
  steps:
  - Initiate immediate structured physical therapy targeting lumbopelvic control and hip mobility while temporarily withholding provocative sport hyperextension loading.
  - Monitor clinical resolution of extension pain alongside bony healing on MRI at 3 months.
  - Counsel athletes and families that bony healing on MRI is associated with markedly lower recurrence (7.3% recurrence vs 50%).
  positive: 'adolescent athletes, n = 53: immediate PT did not worsen healing; 81% healed on MRI at 3 months; healed → 7.3% recurrence vs 50%.'
  interpretation: Supports early active physical rehabilitation without prolonged immobilisation prior to starting PT.
  metrics: 'Sweeney (Selhorst group) 2026 OJSM (adolescent athletes, n = 53): immediate PT did not worsen healing; 81% healed on MRI at 3 months; healed → 7.3% recurrence vs 50%.'
  evidence: L
  sources:
  - text: Sweeney (Selhorst group) 2026 OJSM
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13145073/
    free_full_text: true
  review_status: approved
- id: lumbar-tracking-flowsheet
  type: info
  title: Longitudinal Lumbar Outcome Tracking & MIC Thresholds
  page: 9
  summary: Session-by-session tracking and discharge milestone criteria comparing baseline and follow-up PROMs against validated minimal important change (MIC / MCID) thresholds.
  steps:
  - Record session pain (NPRS), directional preference / centralisation status, neurological re-check, interventions delivered, and loading progression across visits.
  - At discharge, re-administer baseline PROMs (ODI, RMDQ, NPRS, PSFS, TSK-11) and compute absolute and percentage change.
  - Benchmark individual recovery against Ostelo 2008 MIC consensus (VAS 15; NRS 2; RMDQ 5; ODI 10; or 30% improvement from baseline) and scale-specific MCIDs.
  positive: 'MIC consensus: VAS 15; NRS 2; RMDQ 5; ODI 10; or 30% improvement from baseline (Ostelo 2008). Modified Oswestry MCID ≈ 6 points (Fritz 2001). RMDQ clinical improvement = 30% reduction from baseline + better on global rating (Jordan 2006). NPRS MDC 2 points; MCID 2.2 (1 week) / 1.5 (4 weeks) (Childs 2005). PSFS MCID 2 points (ROC); 1.4 (SEM method) (Maughan 2010). TSK-11 reduction ≥ 4 points = important change; ICC 0.81, SEM 2.54 (Woby 2005).'
  interpretation: Combines patient-reported milestones with objective neurological and movement control restoration to support discharge or specialist referral.
  metrics: 'Ostelo 2008: VAS 15; NRS 2; RMDQ 5; ODI 10; or 30% improvement from baseline. Fritz 2001: Modified Oswestry MCID ≈ 6 points. Jordan 2006: RMDQ clinical improvement = 30% reduction from baseline + better on global rating. Childs 2005: NPRS MDC 2 points; MCID 2.2 (1 week) / 1.5 (4 weeks). Maughan 2010: PSFS MCID 2 points (ROC); 1.4 (SEM method). Woby 2005: TSK-11 reduction ≥ 4 points = important change; ICC 0.81, SEM 2.54.'
  evidence: M
