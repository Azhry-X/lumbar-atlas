- id: lbp-secondary-prevention
  type: info
  title: 'Low Back Pain Prevention: Exercise & Education'
  page: 8
  summary: Systematic review and meta-analysis evidence for preventing low back pain episodes through exercise and education.
  steps:
  - Prescribe regular ongoing exercise combined with biopsychosocial back education as the primary preventive strategy.
  - Maintain long-term exercise adherence — protective effects diminish if exercise is discontinued.
  - Avoid relying on lumbar belts, corsets, or foot orthotics for LBP prevention.
  positive: 'exercise + education: RR 0.55 (0.41–0.74); exercise alone RR 0.65 (0.50–0.86) (Steffens 2016); exercise alone RR 0.67 (0.53–0.85) (Shiri 2018).'
  interpretation: Strongest preventive evidence is for exercise combined with education, as well as regular exercise alone.
  metrics: 'Steffens 2016 JAMA Intern Med: exercise + education RR 0.55 (0.41–0.74); exercise alone RR 0.65 (0.50–0.86). Shiri 2018 Am J Epidemiol: exercise alone RR 0.67 (0.53–0.85).'
  evidence: M
