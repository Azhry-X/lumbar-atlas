- id: needling-safety
  title: Dry Needling Adverse Events & Anatomical Danger Zones
  type: info
  page: 7
  review_status: draft
  summary: Adverse event incidence and anatomical danger zones for dry needling in the lumbopelvic region.
  steps:
  - Obtain informed consent and discuss potential adverse events and alternatives.
  - Screen for coagulopathy or anticoagulant medication before treatment (Kearns 2019).
  - Select appropriate needle length and diameter (32–36 gauge, .25–.20 mm; Halle 2016).
  - 'Piriformis needling: Be aware of sciatic nerve proximity; deeper fascia depth 7.0 ± 1.3 cm (Valera-Calero 2024).'
  - 'Quadratus lumborum needling: Direct needle carefully as the kidney lies towards the lateral portion of quadratus lumborum (Halle 2016).'
  positive: Safe needling delivery without adverse events.
  interpretation: Brady 2014 reported mild AEs 19.18 %, upper risk rate for significant AEs ≤ 0.04 %, bruising 7.55 %, bleeding 4.65 % across 7,629 treatments; Boyce 2020 reported minor AE 36.7 %, major AE < .1 % across 20,464 treatments, with prolonged symptom aggravation .03 %, fainting .02 %, forgotten needles .01 %, noting major AEs most often occur with gluteal, lumbar paraspinal, suboccipital and upper trapezius needling; Halle 2016 highlighted serious risks (pneumothorax, cardiac tamponade, haematoma, infection, CNS injury) and noted kidney position relative to lateral quadratus lumborum; Kearns 2019 advised caution regarding haematoma and bruising with anticoagulants; Valera-Calero 2024 documented piriformis deeper fascia depth 7.0 ± 1.3 cm over the sciatic nerve.
  metrics: Mild AEs 19.18 %, significant AEs ≤ 0.04 %, bruising 7.55 %, bleeding 4.65 % (Brady 2014); Minor AE 36.7 %, major AE < .1 % (Boyce 2020); Piriformis fascia 7.0 ± 1.3 cm (Valera-Calero 2024); Needles 32–36 gauge (.25–.20 mm) (Halle 2016)
