- id: traction-trial
  title: Traction — Time-Limited Trial of an Adjunct
  type: info
  page: 6
  review_status: draft
  summary: Evidence and clinical decision framework for a time-limited trial of mechanical traction alongside guideline care.
  steps:
  - Document start date and agreed review date for the trial.
  - 'Screen for specific subgroup: leg symptoms, signs of nerve root compression, and peripheralisation with extension or positive crossed SLR (Fritz 2007).'
  - Combine with active exercise and patient education; do not deliver as standalone therapy.
  - 'Re-evaluate at review date: discontinue immediately if no measurable symptomatic or functional improvement.'
  positive: Meaningful reduction in radicular pain or disability within trial window.
