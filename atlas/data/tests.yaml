  page: 4
  summary: Numeric pain intensity scale (0 = no pain to 10 = worst imaginable pain) averaged across current, best, and worst ratings.
  steps:
  - Ask the patient to rate current pain, best pain, and worst pain on the 0–10 numeric scale.
  - Average the ratings (or track current/worst rating consistently across visits).
  - Compare follow-up reduction against validated MDC and MCID thresholds.
  positive: 'Childs 2005: MDC 2 points; MCID 2.2 (1 week) / 1.5 (4 weeks). Ostelo 2008 (MIC consensus): VAS 15; NRS 2; RMDQ 5; ODI 10; or 30% improvement from baseline.'
  interpretation: Quick, responsive pain intensity measure for every clinical session.
  metrics: 'Childs 2005: MDC 2 points; MCID 2.2 (1 week) / 1.5 (4 weeks). Ostelo 2008 (MIC consensus): VAS 15; NRS 2; RMDQ 5; ODI 10; or 30% improvement from baseline.'
