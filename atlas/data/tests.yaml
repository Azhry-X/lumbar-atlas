- id: incidental-durotomy
  type: info
  title: Incidental Durotomy in Lumbar Spine Surgery
  page: 5
  summary: Intraoperative dural tear incidence across primary discectomy, spinal stenosis decompression, and revision discectomy, and post-operative CSF leak vigilance.
  steps:
  - Check the operative note for any documented incidental durotomy / dural repair and surgeon-directed posture or mobilisation instructions.
  - Screen for postural headache (worse upright, relieved lying flat), nausea, photophobia, dizziness, or clear wound drainage.
  - If CSF leak or pseudomeningocele is suspected, withhold straining/Valsalva and contact the surgical team immediately.
  positive: 'n = 1,549, 14 UK centres: 3.5% primary discectomy; 8.5% stenosis surgery; 13.2% revision discectomy.'
  interpretation: Incidental durotomy is more frequent in revision discectomy and stenosis surgery than in primary discectomy; POST-OP RESTRICTIONS ARE SURGEON-DIRECTED.
  metrics: 'Tafazal & Sell 2005 (n = 1,549, 14 UK centres): 3.5% primary discectomy; 8.5% stenosis surgery; 13.2% revision discectomy.'
